# Render Blueprint for the TetrixAI backend (Express API).
# The frontend is deployed separately on Cloudflare Pages.
# Render redeploys automatically on every push to main.
services:
  - type: web
    name: tetrixai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Set the values below in the Render dashboard (they are secrets or deployment-specific).
      - key: GEMINI_API_KEY
        sync: false
      # Cloudflare Pages URL, e.g. https://tetrixai.pages.dev (comma-separate several origins)
      - key: FRONTEND_URL
        sync: false
      # Must match VITE_FIREBASE_PROJECT_ID; required to verify sign-in tokens in production
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Optional: service account, enables Firestore instead of the local JSON file
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INIT_SECRET
        sync: false
