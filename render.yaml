# Render Blueprint: the whole TetrixAI app (frontend + backend) on Render's free plan.
# New -> Blueprint -> select this repo. Both services redeploy on every push to main.
services:
  # Backend: Express API
  - type: web
    name: tetrixai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Values below are entered in the Render dashboard when the Blueprint is created.
      - key: GEMINI_API_KEY
        sync: false
      # Frontend URL, e.g. https://tetrixai-frontend.onrender.com (comma-separate several origins)
      - key: FRONTEND_URL
        sync: false
      # Must match VITE_FIREBASE_PROJECT_ID; required to verify sign-in tokens in production
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Optional service account: stores data in Firestore instead of the local JSON file
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INIT_SECRET
        sync: false

  # Frontend: React build served as a static site
  - type: web
    name: tetrixai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Single-page app: every route serves index.html so /analysis/<id> works on refresh
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Backend URL including /api, e.g. https://tetrixai-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
